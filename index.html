<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>罐子</title>
<style>
  body { margin: 0; background: #f3ead9; color: #3a2f25; font-family: "PingFang SC", "Noto Sans SC", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 18px 140px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 14px; }
  .open p { margin: 0 0 10px; line-height: 1.7; }
  #log { margin-top: 18px; line-height: 1.75; }
  #log .wk { margin: 22px 0 6px; font-weight: 600; color: #7a5a3a; }
  #log .day { margin-top: 10px; color: #8a7a68; font-size: 14px; }
  #log .ln { margin: 0; }
  #log .sun { margin-top: 12px; font-weight: 600; }
  #log .tab { margin: 8px 0 4px; padding: 10px 12px; background: #e8dcc5; border-radius: 6px; font-size: 14px; line-height: 1.7; }
  #log .tab div { margin: 2px 0; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; background: #efe3cc; border-top: 1px solid #d8c7a8; }
  #bar .in { max-width: 640px; margin: 0 auto; padding: 12px 18px 16px; }
  #ask { margin-bottom: 10px; }
  button { font: inherit; font-size: 16px; padding: 8px 14px; margin: 0 8px 8px 0; border: 1px solid #a88a62; background: #fbf6ec; color: #3a2f25; border-radius: 6px; cursor: pointer; }
  button:hover { background: #fff; }
  button.quiet { border-color: #c9b89b; color: #8a7a68; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>罐子</h1>
  <div class="open">
    <p>站牌底下以前有人给一条黄狗放一罐水。这礼拜那只罐子没了。</p>
    <p>你每天早上七点从这条街上过一回，手里有个罐子，能装满水，放在街上一个地方。狗下午三点前后从这儿过。你只在早上来，下午看不见。</p>
    <p>每个礼拜天你都得出门，去不了。日子是连着过的，礼拜天过完接着是下一个礼拜一。</p>
    <p>街上能放的地方：面包房（门口）、站牌（底下）、岗亭（学校门口，王师傅在里头）、墙根（电线杆后头）。</p>
  </div>
  <div id="log"></div>
</main>
<div id="bar"><div class="in"><div id="ask"></div><div id="btns"></div></div></div>
<script src="sim.js"></script>
<script>
let acts = [];
const MAX = 24;
const log = document.getElementById('log'), ask = document.getElementById('ask'), btns = document.getElementById('btns');
function el(cls, text) { const d = document.createElement('div'); d.className = cls; d.textContent = text; return d; }
function render() {
  const r = gzRun(acts);
  log.innerHTML = '';
  // 过完的礼拜只留标题、礼拜天那句和那张表，每天的早上收起来（罐网1：第二个礼拜末找今天在哪很费眼）
  let lastWk = 0;
  r.out.forEach((l, i) => { if (l.startsWith('\n======')) lastWk = i; });
  let tab = null, old = false;
  r.out.forEach((line, i) => {
    if (line.startsWith('\n======')) { tab = null; old = i < lastWk; log.appendChild(el('wk', line.replace(/[\n=]/g, '').trim())); return; }
    if (line.startsWith('这一礼拜')) { tab = el('tab', ''); tab.appendChild(el('', line)); log.appendChild(tab); return; }
    if (line === '') return;
    if (tab) { tab.appendChild(el('', line)); return; }
    if (line.startsWith('—— ')) {
      const sun = line === '—— 礼拜天 ——';
      if (old && !sun) return;
      log.appendChild(el(sun ? 'day sun' : 'day', line.replace(/—— /g, '').replace(/ ——/g, ''))); return;
    }
    if (old && !line.startsWith('礼拜天你不在')) return;
    log.appendChild(el('ln', line));
  });
  btns.innerHTML = '';
  const n = acts.filter(a => a !== '__看').length;
  if (r.who === 'peek') {
    ask.textContent = '你站在这儿。放哪儿？';
    for (const s of ['面包房', '站牌', '岗亭', '墙根', '原地']) btn(s, () => { acts[acts.length - 1] = s; render(); });
  } else if (n >= MAX) {
    ask.textContent = '四个礼拜过完了。';
    btn('从头再来', () => { acts = []; render(); }, 'quiet');
  } else {
    const DAYS = ['礼拜一', '礼拜二', '礼拜三', '礼拜四', '礼拜五', '礼拜六', '礼拜天'];
    ask.textContent = `现在是${DAYS[r.g % 7]}早上七点。`;
    btn('去', () => { acts.push('__看'); render(); });
    btn('不去', () => { acts.push('不去'); render(); });
    if (acts.length) btn('从头再来', () => { if (confirm('从第一个礼拜一重新开始？')) { acts = []; render(); } }, 'quiet');
  }
  window.scrollTo(0, document.body.scrollHeight);
}
function btn(t, f, cls) { const b = document.createElement('button'); b.textContent = t; b.onclick = f; if (cls) b.className = cls; btns.appendChild(b); }
render();
</script>
</body>
</html>
